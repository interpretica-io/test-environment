---
# SPDX-License-Identifier: Apache-2.0

- comment: |
    WiFi AP and STA settings on Agents.

    Copyright (C) 2025 Interpretica, Unipessoal Lda. All rights reserved.


- register:

    - oid: "/agent/wifi"
      access: read_only
      type: none
      d: |
         Root object of the WiFi configuration tree.
         Name: empty

    - oid: "/agent/wifi/configurator"
      access: read_write
      type: string
      d: |
         Select configurator
         Name: empty
         Value: "uci" or "hostapd_wpa_supplicant"

    - oid: "/agent/wifi/enable"
      access: read_write
      type: string
      d: |
         Enable or disable WiFi
         Name: empty
         Value: 0 or 1

    - oid: "/agent/wifi/port"
      access: read_create
      type: none
      d: |
         WiFi port instance.
         Name: any, typically 2_4 or 5

    - oid: "/agent/wifi/port/ifname"
      access: read_write
      type: string
      d: |
         Interface name
         Name: empty
         Value: Any supported by Linux

    - oid: "/agent/wifi/port/standard"
      access: read_write
      type: string
      d: |
         WiFi standard.
         Name: empty
         Value: g, n, ac, ax

    - oid: "/agent/wifi/port/channel"
      access: read_write
      type: uint8
      d: |
         WiFi channel.
         Name: empty
         Value: Channel number

    - oid: "/agent/wifi/port/frag_threshold"
      access: read_write
      type: uint16
      d: |
         Fragmentation threshold.
         Name: empty
         Value: 0 (disable fragmentation) or 256 .. 2346

    - oid: "/agent/wifi/port/option"
      access: read_create
      type: none
      d: |
         Additional options passed to underlying configurator.
         Name: any
         Value: none

    - oid: "/agent/wifi/port/option/value"
      access: read_write
      type: string
      d: |
         Value of the option passed to underlying configurator.
         Name: empty
         Value: any option permitted by underlying configurator.

    - oid: "/agent/wifi/port/ssid"
      access: read_create
      type: none
      d: |
         SSID instance.
         Name: Internal SSID name

    - oid: "/agent/wifi/port/ssid/ifname"
      access: read_write
      type: string
      d: |
         Interface name
         Name: empty
         Value: Any supported by Linux

    - oid: "/agent/wifi/port/ssid/aname"
      access: read_write
      type: string
      d: |
         SSID name.
         Name: empty
         Value: SSID name

    - oid: "/agent/wifi/port/ssid/mode"
      access: read_write
      type: string
      d: |
         SSID mode
         Name: empty
         Value: ap/sta

    - oid: "/agent/wifi/port/ssid/security"
      access: read_write
      type: string
      d: |
         SSID security.
         Name: empty
         Value: open, wpa, wpa2, wpa3

    - oid: "/agent/wifi/port/ssid/protocol"
      access: read_write
      type: string
      d: |
         SSID protocol.
         Name: empty
         Value: ccmp, tkip

    - oid: "/agent/wifi/port/ssid/passphrase"
      access: read_write
      type: string
      d: |
         SSID passphrase.
         Name: empty
         Value: Passphrase 8 to 63 characters long

    - oid: "/agent/wifi/port/ssid/option"
      access: read_create
      type: none
      d: |
         Additional options passed to underlying configurator.
         Name: any
         Value: none

    - oid: "/agent/wifi/port/ssid/option/value"
      access: read_write
      type: string
      d: |
         Value of the option passed to underlying configurator.
         Name: empty
         Value: any option permitted by underlying configurator.
